<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Relatório de Qualidade</title>
<style>
/* 27/10 (pedido da Maria): fotos GRANDES e inteiras (sem recorte), relatório sem emoji */
@page{size:A4;margin:12mm 10mm}
*{box-sizing:border-box;margin:0;padding:0}
body{font:12px/1.45 'Segoe UI',Arial,sans-serif;color:#16211d;background:#fff;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.pag{max-width:820px;margin:0 auto;padding:18px}
body.gerando .pag{width:820px;max-width:none}
.topo{display:flex;justify-content:space-between;align-items:flex-start;border-bottom:3px solid #0f766e;padding-bottom:10px}
.topo h1{font-size:20px;color:#0f766e}
.sub{color:#5b6b64}
.nota{text-align:right}.nota b{font-size:34px;display:block;line-height:1}
.cv{color:#16a34a}.ca{color:#d97706}.cr{color:#dc2626}
.info{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:12px 0}
.info div{background:#f4f6f5;border-radius:8px;padding:7px 9px}.info span{display:block;color:#5b6b64;font-size:10px;text-transform:uppercase;letter-spacing:.04em}
.resumo{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:6px}
.legenda{font-size:10.5px;margin-bottom:4px}
.chip{display:inline-block;border-radius:99px;padding:2px 10px;font-size:11px;font-weight:700;white-space:nowrap}
.v{background:#e8f7ee;color:#15803d}.a{background:#fdf3e1;color:#b45309}.r{background:#fdecec;color:#dc2626}.n{background:#eef1f4;color:#64748b}
h2{font-size:14px;margin:18px 0 6px;color:#0f766e;border-bottom:1px solid #dfe5e2;padding-bottom:3px}
table{width:100%;border-collapse:collapse}
td{padding:5px 6px;border-bottom:1px solid #eef1ef;vertical-align:middle;text-align:left}
.areas td{font-size:11.5px}
.bar{height:7px;border-radius:4px;width:140px;display:inline-block;vertical-align:middle}
.blk{display:flow-root} /* margens ficam dentro do bloco (PDF do celular mede o bloco) */
.com{color:#3f4d47;font-size:11.5px;margin-top:3px}
.fotos{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.fotos div{height:340px;break-inside:avoid;page-break-inside:avoid;display:flex;align-items:center;justify-content:center;background:#f4f6f5;border:1px solid #dfe5e2;border-radius:6px;overflow:hidden}
.fotos img{display:block;max-width:100%;max-height:100%}
.nc{border:1px solid #f3d9a8;background:#fffbf3;border-radius:8px;padding:9px 11px;margin-bottom:8px}
.nc .tit,.nc .com{break-after:avoid;page-break-after:avoid}
.nc.verm{border-color:#f3c4c4;background:#fff7f7}
.nc .tit{line-height:1.5}
.obs{background:#f4f6f5;border-radius:8px;padding:9px 11px;white-space:pre-wrap}
.cab{display:grid;grid-template-columns:1fr 44px 120px;gap:6px;font-size:10px;color:#5b6b64;text-transform:uppercase;font-weight:700;border-bottom:1px solid #dfe5e2;padding:8px 6px 4px;margin-top:6px}
.lin{display:grid;grid-template-columns:1fr 44px 120px;gap:6px;padding:5px 6px;border-bottom:1px solid #eef1ef;break-inside:avoid;page-break-inside:avoid}
.lin .pp{color:#93a19a;text-align:center}
.rod{margin-top:22px;display:flex;justify-content:space-between;color:#93a19a;font-size:10px;border-top:1px solid #dfe5e2;padding-top:6px}
.ass{margin-top:30px;display:grid;grid-template-columns:1fr 1fr;gap:40px}.ass div{border-top:1px solid #16211d;padding-top:4px;text-align:center;color:#5b6b64}
.demo{background:#ede9fe;color:#6d28d9;font-weight:700;padding:6px 10px;border-radius:8px;margin-top:8px;text-align:center}
.acoes{position:fixed;top:10px;right:10px;display:flex;gap:6px}.acoes button{font:inherit;padding:8px 12px;border-radius:8px;border:1px solid #0f766e;background:#0f766e;color:#fff;cursor:pointer}
@media print{.acoes{display:none}.pag{padding:0}}
@media(max-width:640px){.info{grid-template-columns:1fr 1fr}.acoes{position:static;justify-content:flex-end;padding:8px}}
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
</head>
<body>
<div class="acoes" id="acoes"><button id="b-pdf" onclick="baixarPdf()" disabled>Baixar PDF</button><button onclick="print()">Imprimir</button></div>
<div class="pag" id="pag">carregando...</div>
<script>
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]))
const f2 = (n) => n == null ? '—' : Number(n).toFixed(2).replace('.', ',')
const br = (iso) => iso ? iso.split('-').reverse().join('/') : '—'
const cor = (n) => n == null ? '' : n < 85 ? 'cr' : n < 92 ? 'ca' : 'cv'
const barc = (n) => n == null ? '#cbd5d1' : n < 85 ? '#dc2626' : n < 92 ? '#d97706' : '#16a34a'
const R = { verde: '<span class="chip v">Conforme</span>', amarela: '<span class="chip a">Parcial</span>', vermelha: '<span class="chip r">Não conforme</span>', na: '<span class="chip n">N/A</span>' }
const FN = 'https://kuyhkltbwlkvtgbabscv.supabase.co/functions/v1/qualidade'
let SESS = ''; try { SESS = localStorage.getItem('qual_sessao') || '' } catch {}
let NOME_PDF = 'relatorio.pdf'
// 27/10 (Maria: 'qualidade meio ruim, principalmente das fotos'): antes o html2pdf tirava UM print da pagina
// inteira em escala 2 e fatiava; agora cada bloco (.blk) vira imagem em escala 3 e entra pagina por pagina,
// sem cortar bloco no meio (e sem estourar o limite de canvas do iPhone).
async function baixarPdf() {
  const b = document.getElementById('b-pdf'); b.disabled = true; b.textContent = 'gerando...'
  document.body.classList.add('gerando')
  try {
    const { jsPDF } = window.jspdf
    const pdf = new jsPDF({ unit: 'mm', format: 'a4', compress: true })
    const M = 10, LW = 210 - 2 * M, PH = 297 - 2 * M
    const pag = document.getElementById('pag'), cs = getComputedStyle(pag)
    const k = LW / (pag.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight)) // mm por px de CSS
    const x0 = pag.getBoundingClientRect().left + parseFloat(cs.paddingLeft)
    let y = M
    for (const el of pag.querySelectorAll('.blk')) {
      const cv = await html2canvas(el, { scale: 3, useCORS: true, backgroundColor: '#ffffff', logging: false, windowWidth: 900 })
      const bx = el.getBoundingClientRect(), w = (cv.width / 3) * k, h = (cv.height / 3) * k, x = M + (bx.left - x0) * k // tamanho do canvas (layout de 900px), não da tela
      const st = getComputedStyle(el), mt = parseFloat(st.marginTop) * k, mb = parseFloat(st.marginBottom) * k
      if (y > M) y += mt
      if (h <= PH) {
        if (y + h > M + PH) { pdf.addPage(); y = M }
        pdf.addImage(cv.toDataURL('image/jpeg', 0.92), 'JPEG', x, y, w, h, undefined, 'FAST'); y += h + mb
      } else { // bloco maior que uma pagina: fatia
        const pxPorMm = cv.height / h
        let feito = 0
        while (feito < h - 0.01) {
          if (y >= M + PH - 5) { pdf.addPage(); y = M }
          const fatia = Math.min(h - feito, M + PH - y), c2 = document.createElement('canvas')
          c2.width = cv.width; c2.height = Math.ceil(fatia * pxPorMm)
          const g = c2.getContext('2d'); g.fillStyle = '#fff'; g.fillRect(0, 0, c2.width, c2.height)
          g.drawImage(cv, 0, Math.floor(feito * pxPorMm), cv.width, c2.height, 0, 0, cv.width, c2.height)
          pdf.addImage(c2.toDataURL('image/jpeg', 0.92), 'JPEG', x, y, w, fatia, undefined, 'FAST')
          feito += fatia; y += fatia
        }
        y += mb
      }
    }
    pdf.save(NOME_PDF)
  } catch (e) { alert('não gerou o PDF: ' + e.message) }
  document.body.classList.remove('gerando')
  b.disabled = false; b.textContent = 'Baixar PDF'
}
;(async () => {
  const cod = decodeURIComponent(location.hash.slice(1))
  if (!SESS) { document.getElementById('pag').innerHTML = 'Entre primeiro no app: <a href="./">Qualidade</a>'; return }
  const r = await (await fetch(FN + '/relatorios/' + encodeURIComponent(cod), { headers: { 'x-sessao': SESS } })).json()
  if (r.erro) { document.getElementById('pag').textContent = r.erro; return }
  const TIT = /^relat[óo]rio/i.test(r.modelo_nome || '') ? r.modelo_nome : `Relatório ${r.modelo_nome}` // 26/10: sem 'Relatório Relatório estrutural'
  document.title = `${TIT} — ${r.casa?.nome || ''} — ${br(r.data)}`
  NOME_PDF = `${TIT} -${r.casa ? r.casa.nome : r.casa_id} - ${r.data.split('-').reverse().join('-')}${r.demo ? ' (DEMO)' : ''}.pdf`.normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^\w .()-]/g, '')
  const c = r.calc
  const foto = (f) => `<div><img crossorigin="anonymous" src="${FN}/foto/${encodeURIComponent(f)}?s=${SESS}"></div>`
  const fotos = (x) => (x.fotos || []).length ? `<div class="fotos">${x.fotos.map(foto).join('')}</div>` : ''
  const peso = (p) => String(p).replace('.', ',')
  const contaArea = (a) => [a.vermelha ? `${a.vermelha} não conf.` : '', a.amarela ? `${a.amarela} parcial${a.amarela > 1 ? 'is' : ''}` : ''].filter(Boolean).join(' · ')
  // cada .blk é um pedaço que não pode ser cortado na quebra de página (o PDF do celular monta página por página com eles)
  document.getElementById('pag').innerHTML = `
  <div class="blk">
  <div class="topo"><div><h1>Relatório · ${esc(r.modelo_nome)}</h1><div class="sub">Qualidade e Segurança dos Alimentos — Grupo Botequim</div></div>
    <div class="nota"><span class="sub">Nota final</span><b class="${cor(c.nota)}">${f2(c.nota)}%</b></div></div>
  ${r.demo ? '<div class="demo">RELATÓRIO DE DEMONSTRAÇÃO — dados de teste</div>' : ''}
  <div class="info"><div><span>Restaurante</span><b>${esc(r.casa?.nome || r.casa_id)}</b>${r.casa?.apelido ? '<br>' + esc(r.casa.apelido) : ''}</div><div><span>Data da visita</span><b>${br(r.data)}</b></div>
    <div><span>Nutricionista</span><b>${esc(r.nutri)}</b></div><div><span>Acompanhou</span><b>${esc(r.acompanhou || '—')}</b></div></div>
  <div class="resumo"><span class="chip v">${c.verde} conformes</span><span class="chip a">${c.amarela} parciais</span><span class="chip r">${c.vermelha} não conformes</span><span class="chip n">${c.na} N/A</span>${c.sem ? `<span class="chip n">${c.sem} sem resposta</span>` : ''}</div>
  <div class="sub legenda">Nota = pontos ${f2(c.pontos)} ÷ peso ${f2(c.peso_total)} · Conforme vale 1 · Parcial vale 0,5 · Não conforme vale 0 · N/A fica fora da conta</div>
  </div>
  <div class="blk"><h2>Nota por área</h2>
  <table class="areas">${r.areas.map((a) => `<tr><td>${esc(a.area)}</td><td style="width:170px"><span class="bar" style="background:linear-gradient(to right,${barc(a.nota)} ${a.nota ?? 0}%,#eef1ef ${a.nota ?? 0}%)"></span></td><td style="width:70px" class="${cor(a.nota)}"><b>${a.nota != null ? f2(a.nota) + '%' : 'N/A'}</b></td><td style="width:150px" class="sub">${contaArea(a)}</td></tr>`).join('')}</table></div>
  ${r.ncs.length ? `<div class="blk"><h2>Pontos de atenção (${r.ncs.length})</h2></div>${r.ncs.map((x) => `<div class="blk nc ${x.resposta === 'vermelha' ? 'verm' : ''}"><div class="tit">${R[x.resposta]} <b>${esc(x.area)}</b> — ${esc(x.pergunta)} <span class="sub">(peso ${peso(x.peso)})</span></div>
    ${x.comentario ? `<div class="com">${esc(x.comentario)}</div>` : ''}${fotos(x)}</div>`).join('')}` : '<div class="blk"><h2>Pontos de atenção</h2><div class="sub">Nenhum item fora do padrão.</div></div>'}
  ${r.obs ? `<div class="blk"><h2>Observações gerais</h2><div class="obs">${esc(r.obs)}</div></div>` : ''}
  <div class="blk"><h2>Checklist completo</h2></div>
  ${r.areas.map((a) => `<div class="blk cab"><span>${esc(a.area)}</span><span style="text-align:center">Peso</span><span>Resposta</span></div>${a.itens.map((x) => `<div class="blk lin"><div>${esc(x.pergunta)}${x.comentario ? `<div class="com">${esc(x.comentario)}</div>` : ''}${x.resposta === 'verde' ? fotos(x) : ''}</div><div class="pp">${peso(x.peso)}</div><div>${R[x.resposta] || '<span class="chip n">—</span>'}</div></div>`).join('')}`).join('')}
  <div class="blk"><div class="ass"><div>${esc(r.nutri)} — Nutricionista</div><div>${esc(r.acompanhou || 'Responsável da casa')}</div></div>
  <div class="rod"><span>Relatório nº ${esc(r.codigo)}</span><span>Gerado em ${new Date().toLocaleString('pt-BR')}</span></div></div>`
  // aguarda as fotos (Chrome headless imprime depois do virtual-time-budget)
  await Promise.all([...document.images].map((i) => i.complete ? 0 : new Promise((ok) => { i.onload = i.onerror = ok })))
  document.body.dataset.pronto = '1'
  document.getElementById('b-pdf').disabled = false
  if (/baixar=1/.test(location.search)) baixarPdf()
})()
</script>
</body>
</html>
