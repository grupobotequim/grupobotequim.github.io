<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ranking semanal — Qualidade</title>
<style>
/* 30/10 (pedido da Maria): PDF GERAL do ranking semanal e das reincidências — 1 página, resumo por casa,
   sem o detalhe item a item (o detalhado continua no relatório de cada visita). Sem emoji. */
@page{size:A4;margin:10mm}
*{box-sizing:border-box;margin:0;padding:0}
body{font:12px/1.4 'Segoe UI',Arial,sans-serif;color:#16211d;background:#fff;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.pag{max-width:820px;margin:0 auto;padding:18px}
body.gerando .pag{width:820px;max-width:none}
.topo{display:flex;justify-content:space-between;align-items:flex-end;border-bottom:3px solid #0f766e;padding-bottom:8px}
.topo h1{font-size:20px;color:#0f766e}
.sub{color:#5b6b64}
.cv{color:#16a34a}.ca{color:#d97706}.cr{color:#dc2626}
h2{font-size:13.5px;margin:14px 0 6px;color:#0f766e;border-bottom:1px solid #dfe5e2;padding-bottom:3px}
table{width:100%;border-collapse:collapse}
th{text-align:left;font-size:9.5px;color:#5b6b64;text-transform:uppercase;letter-spacing:.03em;padding:6px 6px;border-bottom:1.5px solid #dfe5e2;vertical-align:bottom}
td{padding:7px 6px;border-bottom:1px solid #eef1ef;vertical-align:top}
td.n{font-size:17px;font-weight:800;white-space:nowrap}
td.pos{font-size:17px;font-weight:800;color:#0f766e;width:34px}
.casa b{font-size:13px}
.itens{font-size:11px;color:#3f4d47}
.itens div{margin-bottom:2px}
.x{display:inline-block;min-width:22px;font-weight:700;color:#dc2626}
.chip{display:inline-block;border-radius:99px;padding:1px 9px;font-size:11px;font-weight:700;white-space:nowrap}
.v{background:#e8f7ee;color:#15803d}.a{background:#fdf3e1;color:#b45309}.r{background:#fdecec;color:#dc2626}.nn{background:#eef1f4;color:#64748b}
.up{color:#16a34a;font-weight:700;white-space:nowrap}.dn{color:#dc2626;font-weight:700;white-space:nowrap}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:10px 0 2px}
.kpis div{background:#f4f6f5;border-radius:8px;padding:7px 9px}.kpis span{display:block;color:#5b6b64;font-size:9.5px;text-transform:uppercase;letter-spacing:.04em}.kpis b{font-size:15px}
.geral div{padding:4px 0;border-bottom:1px solid #eef1ef;font-size:11.5px}
.legenda{font-size:10px;color:#5b6b64;margin-top:10px}
.rod{margin-top:12px;display:flex;justify-content:space-between;color:#93a19a;font-size:10px;border-top:1px solid #dfe5e2;padding-top:5px}
.demo{background:#ede9fe;color:#6d28d9;font-weight:700;padding:5px 10px;border-radius:8px;margin-top:8px;text-align:center;font-size:11px}
.acoes{position:fixed;top:10px;right:10px;display:flex;gap:6px}.acoes button{font:inherit;padding:8px 12px;border-radius:8px;border:1px solid #0f766e;background:#0f766e;color:#fff;cursor:pointer}
@media print{.acoes{display:none}.pag{padding:0;max-width:none}}
@media(max-width:640px){.acoes{position:static;justify-content:flex-end;padding:8px}.kpis{grid-template-columns:1fr 1fr}}
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
</head>
<body>
<div class="acoes" id="acoes"><button id="b-pdf" onclick="baixarPdf()" disabled>Baixar PDF</button><button onclick="print()">Imprimir</button></div>
<div class="pag" id="pag">carregando...</div>
<script>
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]))
const f2 = (n) => n == null ? '—' : Number(n).toFixed(2).replace('.', ',')
const br = (iso) => iso ? iso.split('-').reverse().join('/') : '—'
const brc = (iso) => iso ? iso.slice(8, 10) + '/' + iso.slice(5, 7) : '—'
const cor = (n) => n == null ? '' : n < 85 ? 'cr' : n < 92 ? 'ca' : 'cv'
const evo = (v) => v == null ? '<span class="sub">sem comparação</span>' : v >= 0 ? `<span class="up">subiu ${f2(v)}</span>` : `<span class="dn">caiu ${f2(Math.abs(v))}</span>`
const FN = 'https://kuyhkltbwlkvtgbabscv.supabase.co/functions/v1/qualidade'
const LOCAL = /^(127\.0\.0\.1|localhost)$/.test(location.hostname) // Secretaria (mesmo servidor do /api) — online lê da função com a sessão
let SESS = ''; try { SESS = localStorage.getItem('qual_sessao') || '' } catch {}
const P = new URLSearchParams(location.search)
const TIPO = P.get('tipo') === 'reinc' ? 'reinc' : 'ranking'
const CAP = 8 // a função devolve no máximo 8 reincidências por casa
let NOME_PDF = 'ranking.pdf'

// 1 página: a página inteira vira UMA imagem e cabe numa folha A4 (reduz se precisar)
async function baixarPdf() {
  const b = document.getElementById('b-pdf'); b.disabled = true; b.textContent = 'gerando...'
  document.body.classList.add('gerando')
  try {
    const { jsPDF } = window.jspdf
    const pdf = new jsPDF({ unit: 'mm', format: 'a4', compress: true })
    const M = 10, LW = 210 - 2 * M, PH = 297 - 2 * M
    const cv = await html2canvas(document.getElementById('pag'), { scale: 2.5, backgroundColor: '#ffffff', logging: false, windowWidth: 900 })
    let w = LW, h = (cv.height / cv.width) * LW
    if (h > PH) { w = w * (PH / h); h = PH }
    pdf.addImage(cv.toDataURL('image/jpeg', 0.92), 'JPEG', M + (LW - w) / 2, M, w, h, undefined, 'FAST')
    pdf.save(NOME_PDF)
  } catch (e) { alert('não gerou o PDF: ' + e.message) }
  document.body.classList.remove('gerando')
  b.disabled = false; b.textContent = 'Baixar PDF'
}

function semRepetir(arr) { const v = new Set(); return arr.filter((t) => { const k = String(t).trim().toLowerCase(); if (v.has(k)) return false; v.add(k); return true }) }
const qtdReinc = (rs) => rs.length >= CAP ? CAP + ' ou mais' : String(rs.length)

function montar(d) {
  const linhas = [...d.linhas].sort((a, b) => (a.pos || 99) - (b.pos || 99))
  const nomeDe = Object.fromEntries(d.linhas.map((l) => [l.id, l.nome]))
  const R = d.reincidencias || {}
  const comNota = linhas.filter((l) => l.geral.nota != null)
  const mediaGrupo = comNota.length ? comNota.reduce((s, l) => s + l.geral.nota, 0) / comNota.length : null
  const visitas = linhas.reduce((s, l) => s + (l.geral.n || 0), 0)
  const totReinc = linhas.reduce((s, l) => s + (R[l.id] || []).length, 0) + (linhas.some((l) => (R[l.id] || []).length >= CAP) ? ' ou mais' : '')
  const melhor = comNota[0], subiu = [...comNota].filter((l) => l.geral.delta != null).sort((a, b) => b.geral.delta - a.geral.delta)[0]
  const titulo = TIPO === 'reinc' ? 'Reincidências da semana' : 'Ranking semanal'
  const semTxt = `${brc(d.semana.de)} a ${br(d.semana.ate)}`
  document.title = `${titulo} — Qualidade — ${semTxt}`
  NOME_PDF = `${titulo} - Qualidade - ${d.semana.de.split('-').reverse().join('-')} a ${d.semana.ate.split('-').reverse().join('-')}.pdf`.normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^\w .()-]/g, '')
  const topo = `<div class="topo"><div><h1>${titulo}</h1><div class="sub">Qualidade e Segurança dos Alimentos — Grupo Botequim</div></div>
    <div style="text-align:right"><b style="font-size:14px">Semana ${semTxt}</b><div class="sub">comparada com ${brc(d.anterior.de)} a ${brc(d.anterior.ate)}</div></div></div>
    ${d.tem_demo ? '<div class="demo">esta semana tem relatórios de teste (DEMO) — eles não entram na média</div>' : ''}`
  const kpis = `<div class="kpis"><div><span>Média do grupo</span><b class="${cor(mediaGrupo)}">${f2(mediaGrupo)}%</b></div><div><span>Visitas na semana</span><b>${visitas}</b></div>
    <div><span>1º lugar</span><b>${melhor ? esc(melhor.nome) + ' ' + f2(melhor.geral.nota) : '—'}</b></div>
    <div><span>${TIPO === 'reinc' ? 'Reincidências no grupo' : 'Quem mais subiu'}</span><b>${TIPO === 'reinc' ? totReinc : subiu && subiu.geral.delta > 0 ? esc(subiu.nome) + ' +' + f2(subiu.geral.delta) : '—'}</b></div></div>`
  const nota = (l) => `<td class="n ${cor(l.geral.nota)}">${l.geral.nota != null ? f2(l.geral.nota) : '—'}</td>`
  const rod = `<div class="legenda">Nota = média dos relatórios da semana (sem DEMO). Verde 92 ou mais · amarelo 85 a 91,99 · vermelho abaixo de 85. Reincidência = item que saiu parcial ou não conforme nesta semana e já tinha saído antes na mesma casa (desde ${brc(d.reinc_desde)}).</div>
    <div class="rod"><span>Resumo geral — o detalhe item a item está no relatório de cada visita</span><span>Gerado em ${new Date().toLocaleString('pt-BR')}</span></div>`
  let corpo
  if (TIPO === 'ranking') {
    const piores = (d.piores || []).slice(0, 5)
    corpo = `<h2>Posição das casas</h2>
    <table><tr><th>#</th><th>Casa</th><th>Nota</th><th>Semana anterior</th><th>Evolução</th><th>Visitas</th><th>Reinc.</th><th>O que mais pegou</th></tr>
    ${linhas.map((l) => { const rs = R[l.id] || []; const top = semRepetir((d.piores_por_casa || {})[l.id] || []).slice(0, 3)
      return `<tr><td class="pos">${l.pos ? l.pos + 'º' : '—'}</td><td class="casa"><b>${esc(l.nome)}</b><div class="sub">${esc(l.apelido || '')}</div></td>${nota(l)}
      <td>${f2(l.geral.anterior)}</td><td>${evo(l.geral.delta)}</td><td>${l.geral.n || 0}</td><td>${rs.length ? `<span class="chip r">${qtdReinc(rs)}</span>` : '<span class="chip v">0</span>'}</td>
      <td class="itens">${top.length ? top.map((t) => `<div>· ${esc(t)}</div>`).join('') : '<span class="sub">nada reprovado</span>'}</td></tr>` }).join('')}</table>
    <h2>Geral da semana — o que mais saiu somando todas as casas</h2>
    <div class="geral">${piores.length ? piores.map((p) => `<div><span class="x">${p.vezes}x</span> ${esc(p.pergunta)} <span class="sub">— ${Object.keys(p.casas).map((c) => esc(nomeDe[c] || c)).join(', ')}</span></div>`).join('') : '<div class="sub">nenhum item reprovado nesta semana</div>'}</div>`
  } else {
    // itens que repetem em mais de uma casa
    const ag = {}
    for (const l of linhas) for (const a of R[l.id] || []) { const k = String(a.pergunta).trim().toLowerCase(); (ag[k] = ag[k] || { pergunta: a.pergunta, casas: [], vezes: 0 }); if (!ag[k].casas.includes(l.nome)) ag[k].casas.push(l.nome); ag[k].vezes += a.vezes }
    const varias = Object.values(ag).filter((a) => a.casas.length > 1).sort((a, b) => b.casas.length - a.casas.length || b.vezes - a.vezes).slice(0, 6)
    corpo = `<h2>Reincidências por casa</h2>
    <table><tr><th>#</th><th>Casa</th><th>Nota</th><th>Evolução</th><th>Reincidências</th><th>Itens que mais repetem</th></tr>
    ${linhas.map((l) => { const rs = R[l.id] || []; const top = []; const v = new Set()
      for (const a of rs) { const k = String(a.pergunta).trim().toLowerCase(); if (!v.has(k)) { v.add(k); top.push(a) } if (top.length === 3) break }
      return `<tr><td class="pos">${l.pos ? l.pos + 'º' : '—'}</td><td class="casa"><b>${esc(l.nome)}</b><div class="sub">${esc(l.apelido || '')}</div></td>${nota(l)}
      <td>${evo(l.geral.delta)}</td><td>${rs.length ? `<span class="chip r">${qtdReinc(rs)}</span>` : '<span class="chip v">nenhuma</span>'}</td>
      <td class="itens">${top.length ? top.map((a) => `<div><span class="x">${a.vezes}x</span> ${esc(a.pergunta)}</div>`).join('') : '<span class="sub">nenhum item repetido</span>'}</td></tr>` }).join('')}</table>
    <h2>Itens que repetem em mais de uma casa</h2>
    <div class="geral">${varias.length ? varias.map((a) => `<div><b>${a.casas.length} casas</b> — ${esc(a.pergunta)} <span class="sub">— ${a.casas.map(esc).join(', ')}</span></div>`).join('') : '<div class="sub">nenhum item repetido em mais de uma casa</div>'}</div>`
  }
  document.getElementById('pag').innerHTML = topo + kpis + corpo + rod
}

;(async () => {
  const sem = /^\d{4}-\d{2}-\d{2}$/.test(P.get('semana') || '') ? '?semana=' + P.get('semana') : ''
  let d
  try {
    if (LOCAL) d = await (await fetch('/api/qualidade/comparativo' + sem)).json()
    else {
      if (!SESS) { document.getElementById('pag').innerHTML = 'Entre primeiro no app: <a href="./">Qualidade</a>'; return }
      const r = await fetch(FN + '/comparativo' + sem, { headers: { 'x-sessao': SESS } })
      d = await r.json()
      if (r.status === 401) { document.getElementById('pag').innerHTML = 'Sessão expirada — entre de novo no app: <a href="./">Qualidade</a>'; return }
    }
  } catch (e) { document.getElementById('pag').textContent = 'sem internet — tente de novo'; return }
  if (!d || d.erro || !d.linhas) { document.getElementById('pag').textContent = (d && d.erro) || 'não consegui ler o ranking'; return }
  montar(d)
  document.body.dataset.pronto = '1'
  document.getElementById('b-pdf').disabled = false
  if (P.get('baixar') === '1') baixarPdf()
})()
</script>
</body>
</html>
